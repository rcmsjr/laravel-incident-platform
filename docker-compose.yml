services:
  workspace:
      restart: always
      build:
        context: ./infra/docker/workspace
        args:
          - TZ=${WORKSPACE_TIMEZONE}
          - PHP_VERSION=${PHP_VERSION}
          - NODE_VERSION=${NODE_VERSION}
      container_name: incidentpulse-workspace
      volumes:
        - ./backend:/var/www:cached
        - ./frontend:/var/ui:cached
      ports:
        - "${WORKSPACE_SSH_PORT}:22"
        - "${WORKSPACE_VUE_CLI_SERVE_HOST_PORT}:8080"
        - "${WORKSPACE_VUE_CLI_UI_HOST_PORT}:8000"
        - "${WORKSPACE_VITE_PORT}:5173"
      tty: true

  php-app:
    restart: always
    build:
      context: ./infra/docker/php-fpm
      args:
        - PHP_VERSION=${PHP_VERSION}
    container_name: incidentpulse-api
    volumes:
      - ./infra/docker/php-fpm/php${PHP_VERSION}.ini:/usr/local/etc/php/php.ini
      - ./backend:/var/www:cached
    expose:
      - "${PHP_UPSTREAM_PORT}"
    environment:
      TZ: ${WORKSPACE_TIMEZONE}
    depends_on:
      - postgres
      - redis
      - minio

  nginx:
    restart: always
    build:
      context: ./infra/docker/nginx
      args:
        - PHP_UPSTREAM_CONTAINER=php-app
        - PHP_UPSTREAM_PORT=${PHP_UPSTREAM_PORT}
    container_name: incidentpulse-nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./backend:/var/www:cached
      - ./infra/logs/nginx:/var/log/nginx
      - ./infra/docker/nginx/sites:/etc/nginx/sites-available
    depends_on:
      - php-app

  postgres:
    image: postgres:16-alpine
    container_name: incidentpulse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentpulse -d incidentpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: incidentpulse-redis
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: incidentpulse-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
